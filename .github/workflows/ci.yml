name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dsh: ['0.2.1-rc.2', '0.2.1-rc.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select compatibility runtime
        if: matrix.dsh != '0.2.1-rc.3'
        run: pnpm add --save-dev --save-exact @deepseek-ai/dsh@${{ matrix.dsh }} @deepseek-ai/dsh-host-webserver@${{ matrix.dsh }} @deepseek-ai/dsh-client-connection@${{ matrix.dsh }} --ignore-scripts --lockfile=false

      - name: Build and test
        run: pnpm run check

      - name: Verify committed client bundle
        run: git diff --exit-code -- lib/client.js

      - name: Check distribution package
        run: pnpm pack --pack-destination .runtime/ci-dist
